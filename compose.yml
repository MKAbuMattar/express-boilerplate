# Local stack: certs + app + Postgres + Redis.
#   docker compose up --build        then open https://localhost/docs
#
# Switch database or cache by setting these in .env (compose reads it):
#   DB_TYPE=mysql   DB_URL=mysql://app:app@mysql:3306/app          + --profile mysql
#   DB_TYPE=mariadb DB_URL=mysql://app:app@mariadb:3306/app        + --profile mariadb
#   DB_TYPE=mongodb DB_URL=mongodb://app:app@mongodb:27017/app?authSource=admin + --profile mongodb
#   CACHE_URL=redis://valkey:6379                                   + --profile valkey
services:
  certs:
    build: {context: ., target: certs}
    volumes:
      - ./certs:/certs

  app:
    build: {context: ., target: runtime}
    container_name: express-boilerplate
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 8443
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
      TLS_KEY_FILE: /app/certs/server.key
      TLS_CERT_FILE: /app/certs/server.crt
      TLS_CA_FILE: /app/certs/ca.crt
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_URL: ${DB_URL:-postgres://app:app@postgres:5432/app}
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      CACHE_TYPE: ${CACHE_TYPE:-redis}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379}
    ports:
      - "443:8443"
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      certs: {condition: service_completed_successfully}
      postgres: {condition: service_healthy, required: false}
      redis: {condition: service_healthy, required: false}
      mysql: {condition: service_healthy, required: false}
      mariadb: {condition: service_healthy, required: false}
      mongodb: {condition: service_healthy, required: false}
      valkey: {condition: service_healthy, required: false}

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  mysql:
    image: mysql:9
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_DATABASE: app
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp"]
      interval: 3s
      retries: 40

  mariadb:
    image: mariadb:12
    profiles: [mariadb]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_DATABASE: app
    ports: ["3307:3306"]
    volumes: [mariadb-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  mongodb:
    image: mongo:8
    profiles: [mongodb]
    environment:
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: app
    ports: ["27017:27017"]
    volumes: [mongodb-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      retries: 40

  valkey:
    image: valkey/valkey:9-alpine
    profiles: [valkey]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      retries: 20

volumes:
  postgres-data:
  mysql-data:
  mariadb-data:
  mongodb-data:
