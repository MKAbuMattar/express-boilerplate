# Local stack: certs + edge (APISIX data plane, control plane, etcd,
# dashboard) + app + Postgres + Redis.
#   docker compose up --build        then open https://api.express-boilerplate.len/docs
#
# Clients reach only the APISIX data plane on 443 (TCP for HTTP/1.1 and
# HTTP/2, UDP for HTTP/3). Nothing else is published except the databases.
# The app is internal and trusts exactly one proxy hop.
#
# Full local stack (Keycloak, Vault, Prometheus/Grafana/Loki/Tempo, Mailpit),
# app configured for all of it:
#   APP_ENV_FILE=deploy/full-stack.env docker compose --profile full up --build
# Or pick profiles: idp, vault, observability, mail.
#
# Every server is HTTPS on 443 through APISIX, one wildcard cert
# (*.express-boilerplate.len from `pnpm certs`, which prints the hosts lines):
#   public gateway (127.0.0.1)
#   https://api.express-boilerplate.len         app (HTTP/3); also https://localhost
# @feature:idp
#   https://keycloak.express-boilerplate.len    Keycloak login pages (admin/admin, user alice/alice)
# @end:idp
#   private gateway (127.0.0.2)
#   https://dashboard.express-boilerplate.len   APISIX Dashboard, private routes (admin/admin)
#   https://dashboard-public.express-boilerplate.len   APISIX Dashboard, public routes
# @feature:metrics
#   https://grafana.express-boilerplate.len     Grafana (admin/admin)
# @end:metrics
# @feature:metrics
#   https://prometheus.express-boilerplate.len  Prometheus
# @end:metrics
# @feature:mail
#   https://mailpit.express-boilerplate.len     Mailpit
# @end:mail
# @feature:vault
#   https://vault.express-boilerplate.len       Vault (dev-root-token)
# @end:vault
#
# Switch database or cache by setting these in .env (compose reads it):
# @feature:db-mysql
#   DB_TYPE=mysql   DB_URL=mysql://app:app@mysql:3306/app          + --profile mysql
# @end:db-mysql
# @feature:db-mysql
#   DB_TYPE=mariadb DB_URL=mysql://app:app@mariadb:3306/app        + --profile mariadb
# @end:db-mysql
# @feature:db-mongodb
#   DB_TYPE=mongodb DB_URL=mongodb://app:app@mongodb:27017/app?authSource=admin + --profile mongodb
# @end:db-mongodb
# @feature:redis
#   CACHE_URL=redis://valkey:6379                                   + --profile valkey
# @end:redis
# Every image, pinned by digest, in one place. Bump a version here.
x-images:
  etcd: &etcd-image quay.io/coreos/etcd:v3.6.8@sha256:b88bf32c663e2599bd3742ded6cd9106431288528c0d2c9425fb03f348f59419
  # The control and data planes must run the same APISIX.
  apisix: &apisix-image apache/apisix:3.19.0-debian@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141
  apisix-dashboard: &apisix-dashboard-image apache/apisix-dashboard:3.0.1-alpine@sha256:b5fafc11b76f998269375192ac33efc992d72aa69bfd7f3eb2ca377906cdbb6d
  node: &node-image node:26-alpine@sha256:8996bb5821d62a8fd9bb27c1cb07462f3fdce6e47d640c6a881ead0b064ce216
  postgres: &postgres-image postgres:18-alpine@sha256:eaef288f54a90a909e49f0121d5d047a5e974e922699de4249625cf7cde34f36
  # @feature:redis
  redis: &redis-image redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
  valkey: &valkey-image valkey/valkey:9-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
  # @end:redis
  # @feature:db-mysql
  mysql: &mysql-image mysql:9@sha256:df90258da46f6e7ff8574ff84f17618aba0765cac749928299c69fd4e7cb8ad8
  mariadb: &mariadb-image mariadb:12@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
  # @end:db-mysql
  # @feature:db-mongodb
  mongodb: &mongodb-image mongo:7@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4 # 8.0+ fails on kernel 6.19+ (SERVER-121912)
  # @end:db-mongodb
  # @feature:idp
  keycloak: &keycloak-image quay.io/keycloak/keycloak:26.8.2@sha256:3879c623248408de29a5303178b5816c77e8dfef3890c361f8c0bbeaa979ba3b
  # @end:idp
  # @feature:vault
  vault: &vault-image hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
  # @end:vault
  # @feature:metrics
  prometheus: &prometheus-image prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
  loki: &loki-image grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
  alloy: &alloy-image grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
  grafana: &grafana-image grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
  # @end:metrics
  # @feature:tracing
  tempo: &tempo-image grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
  # @end:tracing
  # @feature:mail
  mailpit: &mailpit-image axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
  # @end:mail
# What every APISIX plane (two control, two data) shares.
x-apisix: &apisix
  image: *apisix-image
  restart: unless-stopped
  group_add: ["1000"] # reads the cert keys (group 1000, mode 640)

# One dashboard per gateway, both reached through the private gateway.
x-apisix-dashboard: &apisix-dashboard
  image: *apisix-dashboard-image
  restart: unless-stopped
  depends_on:
    etcd: { condition: service_healthy }

# How often a dependency is probed before others start.
x-healthcheck: &healthcheck
  interval: 3s
  retries: 20

services:
  certs:
    build: { context: ., target: certs }
    environment:
      # Names the CA after you, so it is recognizable in your trust store.
      CA_OWNER: ${USER:-developer} (compose)
    volumes:
      - ./certs:/certs

  # --- Edge: APISIX, decoupled like production ------------------------------
  # etcd holds the config; the control plane writes it through the Admin API
  # (apisix-seed, the dashboard); the data plane reads it and serves 443.
  # Every etcd connection is TLS with a client certificate.
  etcd:
    image: *etcd-image
    restart: unless-stopped
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=https://0.0.0.0:2379
      - --advertise-client-urls=https://etcd:2379
      - --cert-file=/certs/etcd.crt
      - --key-file=/certs/etcd.key
      - --client-cert-auth
      - --trusted-ca-file=/certs/ca.crt
    volumes:
      - ./certs:/certs:ro
      - etcd-data:/etcd-data
    healthcheck:
      test:
        - CMD
        - etcdctl
        - --endpoints=https://localhost:2379
        - --cacert=/certs/ca.crt
        - --cert=/certs/etcd-client.crt
        - --key=/certs/etcd-client.key
        - endpoint
        - health
      interval: 3s
      retries: 20
    depends_on:
      certs: { condition: service_completed_successfully }

  # Two gateways, like production: each has its own control plane, data
  # plane and etcd prefix, so a public data plane can never load a private
  # route.
  #   public   ${PUBLIC_IP:-127.0.0.1}:443   api, login pages (what users reach)
  #   private  ${PRIVATE_IP:-127.0.0.2}:443  dashboards, metrics, secrets, mail
  # 127.0.0.2 is loopback on Linux; on macOS add it once:
  #   sudo ifconfig lo0 alias 127.0.0.2
  apisix-cp:
    <<: *apisix
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-dev-admin-key-change-me}
      APISIX_ETCD_PREFIX: /apisix-public
    # Admin API on 9180, internal only.
    volumes:
      - ./deploy/apisix/config-cp.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./certs:/certs:ro
    depends_on:
      etcd: { condition: service_healthy }

  apisix-private-cp:
    <<: *apisix
    environment:
      APISIX_ADMIN_KEY: ${APISIX_PRIVATE_ADMIN_KEY:-dev-private-admin-key-change-me}
      APISIX_ETCD_PREFIX: /apisix-private
    volumes:
      - ./deploy/apisix/config-cp.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./certs:/certs:ro
    depends_on:
      etcd: { condition: service_healthy }

  apisix-seed:
    image: *node-image
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-dev-admin-key-change-me}
      APISIX_PRIVATE_ADMIN_KEY: ${APISIX_PRIVATE_ADMIN_KEY:-dev-private-admin-key-change-me}
      DEV_DOMAIN: ${DEV_DOMAIN:-express-boilerplate.len}
    command: ["node", "/seed.mjs"]
    user: "1000"
    volumes:
      - ./deploy/apisix/seed.mjs:/seed.mjs:ro
      - ./certs:/certs:ro
    depends_on:
      apisix-cp: { condition: service_started }
      apisix-private-cp: { condition: service_started }

  apisix:
    <<: *apisix
    environment:
      APISIX_ETCD_PREFIX: /apisix-public
    ports:
      - "${PUBLIC_IP:-127.0.0.1}:443:443/tcp"
      - "${PUBLIC_IP:-127.0.0.1}:443:443/udp" # HTTP/3 (QUIC)
    # APISIX runs as a non-root user; let it bind 443 in its own namespace.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 443
    volumes:
      - ./deploy/apisix/config-dp.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./certs:/certs:ro
    # @feature:idp
    networks:
      default:
        # The app reaches Keycloak by the name the browser uses, through the
        # gateway, so the token issuer matches on both sides.
        aliases: [keycloak.express-boilerplate.len]
    # @end:idp
    depends_on:
      etcd: { condition: service_healthy }
      apisix-seed: { condition: service_completed_successfully }

  apisix-private:
    <<: *apisix
    environment:
      APISIX_ETCD_PREFIX: /apisix-private
    ports:
      - "${PRIVATE_IP:-127.0.0.2}:443:443/tcp"
      - "${PRIVATE_IP:-127.0.0.2}:443:443/udp"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 443
    volumes:
      - ./deploy/apisix/config-dp.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./certs:/certs:ro
    depends_on:
      etcd: { condition: service_healthy }
      apisix-seed: { condition: service_completed_successfully }

  apisix-dashboard:
    <<: *apisix-dashboard
    # https://dashboard-public.express-boilerplate.len (admin/admin)
    volumes:
      - ./deploy/apisix/dashboard-public.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
      - ./certs:/certs:ro

  apisix-private-dashboard:
    <<: *apisix-dashboard
    # https://dashboard.express-boilerplate.len (admin/admin)
    volumes:
      - ./deploy/apisix/dashboard-private.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
      - ./certs:/certs:ro

  app:
    build: { context: ., target: runtime }
    container_name: express-boilerplate
    restart: unless-stopped
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 8443
      PUBLIC_URL: ${PUBLIC_URL:-https://api.express-boilerplate.len}
      TLS_KEY_FILE: /app/certs/server.key
      TLS_CERT_FILE: /app/certs/server.crt
      TLS_CA_FILE: /app/certs/ca.crt
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_URL: ${DB_URL:-postgres://app:app@postgres:5432/app}
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      # @feature:redis
      CACHE_TYPE: ${CACHE_TYPE:-redis}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379}
      QUEUE_TYPE: ${QUEUE_TYPE:-bullmq}
      # @end:redis
      TRUST_PROXY: 1
      # Every connection needs a client cert: APISIX and Prometheus present
      # client.crt. No forwarded client certs: the gateway is not the trusted
      # proxy identity, so end-user mTLS goes straight to the app.
      TLS_CLIENT_AUTH: require
    expose: ["8443"] # internal only; APISIX is the public entry point
    # Ready means answering HTTPS: --wait and the gateway's first requests
    # otherwise race the boot and get "connection refused". The app requires
    # a client certificate, so the check presents one.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const fs = require('node:fs');
          require('node:https').get({host: '127.0.0.1', port: 8443, path: '/livez',
          servername: 'localhost', ca: fs.readFileSync('/app/certs/ca.crt'),
          cert: fs.readFileSync('/app/certs/client.crt'),
          key: fs.readFileSync('/app/certs/client.key')},
          (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - ./certs:/app/certs:ro
    # Least privilege: read-only filesystem, no Linux capabilities, no
    # setuid escalation, bounded process count.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    depends_on:
      certs: { condition: service_completed_successfully }
      postgres: { condition: service_healthy, required: false }
      # @feature:redis
      redis: { condition: service_healthy, required: false }
      # @end:redis
      # @feature:db-mysql
      mysql: { condition: service_healthy, required: false }
      # @end:db-mysql
      # @feature:db-mysql
      mariadb: { condition: service_healthy, required: false }
      # @end:db-mysql
      # @feature:db-mongodb
      mongodb: { condition: service_healthy, required: false }
      # @end:db-mongodb
      # @feature:redis
      valkey: { condition: service_healthy, required: false }
      # @end:redis
      # @feature:vault
      vault-seed: { condition: service_completed_successfully, required: false }
      # @end:vault
      # @feature:idp
      keycloak: { condition: service_healthy, required: false }
      # @end:idp

  postgres:
    image: *postgres-image
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      # Over TCP: the first-start init server listens on the socket only and
      # then restarts, so a socket check says ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      <<: *healthcheck

  # @feature:redis
  redis:
    image: *redis-image
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck
  # @end:redis

  # @feature:db-mysql
  mysql:
    image: *mysql-image
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_DATABASE: app
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      # 127.0.0.1, not localhost (the socket): the init server skips networking.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp"]
      <<: *healthcheck
      retries: 40
  # @end:db-mysql

  # @feature:db-mysql
  mariadb:
    image: *mariadb-image
    profiles: [mariadb]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_DATABASE: app
    ports: ["3307:3306"]
    volumes: [mariadb-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      <<: *healthcheck
      retries: 40
  # @end:db-mysql

  # @feature:db-mongodb
  mongodb:
    image: *mongodb-image
    profiles: [mongodb]
    environment:
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: app
    ports: ["27017:27017"]
    volumes: [mongodb-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      <<: *healthcheck
      retries: 40
  # @end:db-mongodb

  # @feature:redis
  valkey:
    image: *valkey-image
    profiles: [valkey]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      <<: *healthcheck
  # @end:redis

  # @feature:idp
  # --- Identity provider ---------------------------------------------------
  keycloak:
    image: *keycloak-image
    profiles: [idp, full]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: https://keycloak.express-boilerplate.len
      KC_PROXY_HEADERS: xforwarded
      KC_HTTPS_PORT: 8543
      KC_HTTPS_CERTIFICATE_FILE: /certs/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/server.key
      KC_HTTP_ENABLED: "false"
    volumes:
      - ./deploy/keycloak/demo-realm.json:/opt/keycloak/data/import/demo-realm.json:ro
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8543"]
      interval: 5s
      retries: 60
    depends_on:
      certs: { condition: service_completed_successfully }
  # @end:idp

  # @feature:vault
  # --- Secrets ---------------------------------------------------------------
  vault:
    image: *vault-image
    profiles: [vault, full]
    # Dev mode: in-memory, unsealed, KV v2 at secret/. Never for production.
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      <<: *healthcheck
  # @end:vault

  # @feature:vault
  vault-seed:
    image: *vault-image
    profiles: [vault, full]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    # Random secrets once per Vault: a later `up` keeps them, or the running
    # app (which read them at boot) and Vault would disagree.
    entrypoint:
      - sh
      - -c
      - >-
        vault kv get secret/express-boilerplate > /dev/null 2>&1 ||
        vault kv put secret/express-boilerplate
        SESSION_SECRET="$$(head -c 32 /dev/urandom | base64)"
        JWT_SECRET="$$(head -c 32 /dev/urandom | base64)"
        HMAC_CLIENTS="partner-a:$$(head -c 24 /dev/urandom | base64)"
    depends_on:
      vault: { condition: service_healthy }
  # @end:vault

  # @feature:metrics
  # --- Observability -------------------------------------------------------
  prometheus:
    image: *prometheus-image
    profiles: [observability, full]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./certs:/certs:ro
    group_add: ["1000"] # reads client.key (group 1000, mode 640)
  # @end:metrics

  # @feature:metrics
  loki:
    image: *loki-image
    profiles: [observability, full]
    command: ["-config.file=/etc/loki/local-config.yaml"]
  # @end:metrics

  # @feature:tracing
  tempo:
    image: *tempo-image
    profiles: [observability, full]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
  # @end:tracing

  # @feature:metrics
  alloy:
    image: *alloy-image
    profiles: [observability, full]
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./deploy/observability/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only, local dev only: Docker socket access is root-equivalent.
      - /var/run/docker.sock:/var/run/docker.sock:ro
  # @end:metrics

  # @feature:metrics
  grafana:
    image: *grafana-image
    profiles: [observability, full]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: https://grafana.express-boilerplate.len
    volumes:
      - ./deploy/observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./deploy/observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./deploy/observability/grafana/api-overview.json:/etc/grafana/provisioning/dashboards/api-overview.json:ro
  # @end:metrics

  # @feature:mail
  # --- Mail ------------------------------------------------------------------
  mailpit:
    image: *mailpit-image
    profiles: [mail, full]
  # @end:mail

volumes:
  etcd-data:
  postgres-data:
  # @feature:db-mysql
  mysql-data:
  # @end:db-mysql
  # @feature:db-mysql
  mariadb-data:
  # @end:db-mysql
  # @feature:db-mongodb
  mongodb-data:
  # @end:db-mongodb
