# Gateway routes (APISIX standalone). The app still authenticates and
# authorizes every request itself; the gateway adds an outer layer.
upstreams:
  - id: app
    type: roundrobin
    scheme: https
    nodes:
      "app:8443": 1
    pass_host: pass
    timeout:
      connect: 5
      send: 30
      read: 30

routes:
  - id: app
    uris: ["/api/*", "/auth/*", "/.well-known/*"]
    upstream_id: app
    plugins:
      # Same header the app uses, so one id spans gateway and app logs.
      request-id:
        header_name: X-Request-Id
        include_in_response: true
      # Coarse per-IP limit at the edge; the app keeps its finer limits.
      limit-count:
        count: 1200
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
      # 1 MB, like the app, rejected before it reaches the app.
      client-control:
        max_body_size: 1048576
      prometheus: {}
#END
