# APISIX in standalone mode: routes come from apisix.yaml, no etcd needed.
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

apisix:
  node_listen: 9080

# The app runs with TLS_CLIENT_AUTH=require, so the gateway presents a client
# cert on every upstream connection.
nginx_config:
  http_server_location_configuration_snippet: |
    proxy_ssl_certificate /certs/client.crt;
    proxy_ssl_certificate_key /certs/client.key;

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
