global:
  scrape_interval: 15s

scrape_configs:
  - job_name: app
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /certs/ca.crt
      server_name: localhost
      # The app runs with TLS_CLIENT_AUTH=require.
      cert_file: /certs/client.crt
      key_file: /certs/client.key
    static_configs:
      - targets: ["app:8443"]

  - job_name: apisix
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ["apisix:9091", "apisix-private:9091"]
