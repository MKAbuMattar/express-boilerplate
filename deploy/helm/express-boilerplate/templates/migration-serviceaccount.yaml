{{- if .Values.migrations.enabled }}
# The migration Job is a pre-install hook, so it runs before the chart's
# normal resources exist, the app ServiceAccount included. It gets its own,
# created as an earlier hook (weight -10). Argo CD maps these Helm hooks to
# PreSync, so the same order holds there.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eb.fullname" . }}-migrate
  labels:
    {{- include "eb.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
# Migrations only talk to the database: no Kubernetes API token.
automountServiceAccountToken: false
{{- end }}
