{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eb.serviceAccountName" . }}
  labels:
    {{- include "eb.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # The app never calls the Kubernetes API: no token to steal.
automountServiceAccountToken: false
{{- end }}
