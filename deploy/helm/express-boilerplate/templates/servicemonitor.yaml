{{- if .Values.serviceMonitor.enabled }}
# Prometheus Operator scrapes GET /metrics. The app answers it only to
# OPS_ALLOWED_CIDRS, which by default includes the private pod ranges.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "eb.fullname" . }}
  labels:
    {{- include "eb.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "eb.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: https
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scheme: https
      # Verified TLS: the pod cert is issued for the Service name.
      tlsConfig:
        serverName: {{ include "eb.fullname" . }}.{{ .Release.Namespace }}.svc
        ca:
          secret:
            name: {{ include "eb.tlsSecretName" . }}
            key: ca.crt
{{- end }}
