{{- if .Values.externalSecret.enabled }}
{{- if .Values.secrets.existingSecret }}
{{- fail "Set either secrets.existingSecret or externalSecret.enabled, not both" }}
{{- end }}
# External Secrets Operator copies the app secrets from the store (Vault KV,
# AWS Secrets Manager, GCP, Azure...) into a Kubernetes Secret, so no secret
# value is ever in Git or in Helm values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "eb.fullname" . }}
  labels:
    {{- include "eb.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "eb.secretName" . }}
    creationPolicy: Owner
  dataFrom:
    # Every key under this path becomes an env var (SESSION_SECRET, JWT_SECRET...).
    - extract:
        key: {{ required "externalSecret.remoteKey is required" .Values.externalSecret.remoteKey }}
{{- end }}
