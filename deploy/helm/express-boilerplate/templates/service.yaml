apiVersion: v1
kind: Service
metadata:
  name: {{ include "eb.fullname" . }}
  labels:
    {{- include "eb.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "eb.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    # TLS only: the pod serves HTTPS on 443 and nothing else.
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
      appProtocol: https
