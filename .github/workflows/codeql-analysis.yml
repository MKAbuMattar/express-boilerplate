name: CodeQL Analysis

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  # Pull requests too: main has results from this workflow, so a PR without
  # them fails code scanning with "configuration not found".
  pull_request:
    branches: [main]

permissions: write-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript
          # The app and the layer packages; tests and build output are left out.
          config: |
            paths:
              - apps/api/src
              - packages
            paths-ignore:
              - "**/dist"

      - name: Autobuild
        uses: github/codeql-action/autobuild@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          # The name results had under the old one-language matrix, so they
          # stay comparable with earlier runs.
          category: /language:javascript
