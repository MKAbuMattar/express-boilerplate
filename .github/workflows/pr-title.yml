name: Validate PR title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions: write-all

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            docs
            ci
            chore
          subjectPattern: ^[a-zA-Z].+$
          subjectPatternError: |
            The subject "{subject}" in the pull request title "{title}" must
            start with a letter.
          # A "[WIP]" prefix skips the check until the title is final.
          wip: true
