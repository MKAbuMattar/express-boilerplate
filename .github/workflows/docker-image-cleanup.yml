name: Docker Image CI Cleanup

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

permissions: write-all

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get the repository name lowercase
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Delete old container images
        env:
          GH_TOKEN: ${{ secrets.PAT_DEL_TOKEN }}
          REPO_NAME: ${{ env.REPO_NAME }}
        # Keep the 5 newest versions. Sorted after paging, because --jq runs
        # on each page separately.
        run: |
          gh api --paginate "/user/packages/container/${REPO_NAME}/versions" \
            --jq '.[] | [.created_at, .id] | @tsv' \
            | sort -r | tail -n +6 | cut -f2 \
            | while read -r id; do
                echo "Deleting version $id"
                gh api --method DELETE "/user/packages/container/${REPO_NAME}/versions/$id" || true
              done
